name: Website

# Builds the website (landing page and live demo) and publishes it to GitHub Pages.
# It runs after each Release run that succeeded, so the site always shows tested code
# and the newest released version. It can also be started by hand from the Actions tab.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer one waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # publish to GitHub Pages
      id-token: write     # lets GitHub Pages check that the upload comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags: the page shows the latest released version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The demo on the site is recorded from the real tool running on the sample solution.
      # CF_ANALYTICS_TOKEN (a repository variable) turns on Cloudflare Web Analytics; without it there is none.
      - name: Build the site
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          dotnet restore samples/Shop/Shop.sln
          node site/generate.mjs --out _site

      # The map of a well-known open-source solution, so visitors can see Sightline on real code:
      # eShop (MIT, by the .NET Foundation) at a fixed commit. Its source is read from GitHub by the page,
      # not copied into the site.
      - name: Map of eShop
        env:
          ESHOP_COMMIT: 913acea66708a59595351174cee9b29f37179d29
        run: |
          git init -q "$RUNNER_TEMP/eShop"
          git -C "$RUNNER_TEMP/eShop" fetch -q --depth 1 https://github.com/dotnet/eShop "$ESHOP_COMMIT"
          git -C "$RUNNER_TEMP/eShop" checkout -q FETCH_HEAD
          dotnet run --project src/Co.Revington.Sightline -c Release -- export "$RUNNER_TEMP/eShop/eShop.slnx" \
            --out _site/explore/eshop --title "eShop" \
            --source-url "https://raw.githubusercontent.com/dotnet/eShop/$ESHOP_COMMIT/{path}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
