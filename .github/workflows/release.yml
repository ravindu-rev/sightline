name: Release

# Every push to master is built and tested. If code under src/ changed, it is also released:
# a new version number, a NuGet package, a git tag and a GitHub release with notes.
#
# Two names here must match the trusted publishing policy on nuget.org:
# this file's name, "release.yml", and the environment of the publish job, "production".

on:
  push:
    branches: [master]
  workflow_dispatch:      # "Run workflow" on GitHub: release even if src/ did not change

# One release at a time. A newer push waits for the running one, so two pushes never get the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all commits and tags: the next version is worked out from them

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet restore Co.Revington.Sightline.sln
          dotnet restore samples/Shop/Shop.sln
          dotnet build Co.Revington.Sightline.sln -c Release --no-restore
          dotnet test Co.Revington.Sightline.sln -c Release --no-build

      - name: Plan the release
        id: plan
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/plan-release.sh

  # Only this job can publish, and it only runs when there is something to release.
  publish:
    needs: test
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.nuget.org/packages/Co.Revington.Sightline/${{ needs.test.outputs.version }}
    permissions:
      contents: write     # create the tag and the GitHub release
      id-token: write     # prove to nuget.org which repository and environment is publishing (no stored API key)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release notes list the commits since the last tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Write the release notes
        env:
          NOTES_ONLY: true
        run: bash .github/scripts/plan-release.sh

      # Two packages, one version: the tool, and the same tool as a package for a project.
      - name: Pack
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          dotnet pack src/Co.Revington.Sightline/Co.Revington.Sightline.csproj -c Release -o artifacts -p:Version=$VERSION -p:ContinuousIntegrationBuild=true
          dotnet pack src/Co.Revington.Sightline.Hosting/Co.Revington.Sightline.Hosting.csproj -c Release -o artifacts -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}   # the nuget.org account that created the trusted publishing policy

      - name: Publish to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The VS Code extension gets the same version. It is published to the VS Code Marketplace and to
      # Open VSX (for VS Code forks) when their tokens are set as repository secrets; it is attached
      # to the GitHub release either way.
      - name: Package the VS Code extension
        working-directory: vscode
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce@3 package --no-dependencies --out "../artifacts/sightline-$VERSION.vsix"

      # Secrets cannot appear in "if:", so this step says which tokens exist.
      - name: Which marketplaces are set up
        id: markets
        env:
          VSCE: ${{ secrets.VSCE_PAT != '' }}
          OVSX: ${{ secrets.OVSX_PAT != '' }}
        run: |
          echo "vsce=$VSCE" >> "$GITHUB_OUTPUT"
          echo "ovsx=$OVSX" >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Code Marketplace
        if: steps.markets.outputs.vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath "artifacts/sightline-${{ needs.test.outputs.version }}.vsix"

      - name: Publish to Open VSX
        if: steps.markets.outputs.ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0 publish "artifacts/sightline-${{ needs.test.outputs.version }}.vsix" -p "$OVSX_PAT"

      # Last on purpose: the tag marks a version as released, so it is only set once the package is out.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.test.outputs.version }}" artifacts/*.nupkg artifacts/*.vsix
          --title "Sightline ${{ needs.test.outputs.version }}"
          --notes-file release-notes.md
          --target "$GITHUB_SHA"
