name: Release

# Every push to master is built and tested. If code under src/ or vscode/ changed, it is also released:
# a new version number, the NuGet packages, a git tag, a GitHub release with notes, and the VS Code
# extension, published from that release to the VS Code Marketplace.
#
# Two names here must match the trusted publishing policies on nuget.org and on the VS Code Marketplace:
# this file's name, "release.yml", and the environment of the publish and extension jobs, "production".

on:
  push:
    branches: [master]
  workflow_dispatch:      # "Run workflow" on GitHub: release even if src/ and vscode/ did not change
    inputs:
      extension:
        description: Only publish the VS Code extension of the latest release (no new version)
        type: boolean
        default: false

# One release at a time. A newer push waits for the running one, so two pushes never get the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.extension }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all commits and tags: the next version is worked out from them

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet restore Co.Revington.Sightline.sln
          dotnet restore samples/Shop/Shop.sln
          dotnet build Co.Revington.Sightline.sln -c Release --no-restore
          dotnet test Co.Revington.Sightline.sln -c Release --no-build

      - name: Plan the release
        id: plan
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/plan-release.sh

  # Only this job can publish, and it only runs when there is something to release.
  publish:
    needs: test
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.nuget.org/packages/Co.Revington.Sightline/${{ needs.test.outputs.version }}
    permissions:
      contents: write     # create the tag and the GitHub release
      id-token: write     # prove to nuget.org which repository and environment is publishing (no stored API key)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release notes list the commits since the last tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Write the release notes
        env:
          NOTES_ONLY: true
        run: bash .github/scripts/plan-release.sh

      # Two packages, one version: the tool, and the same tool as a package for a project.
      - name: Pack
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          dotnet pack src/Co.Revington.Sightline/Co.Revington.Sightline.csproj -c Release -o artifacts -p:Version=$VERSION -p:ContinuousIntegrationBuild=true
          dotnet pack src/Co.Revington.Sightline.Hosting/Co.Revington.Sightline.Hosting.csproj -c Release -o artifacts -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}   # the nuget.org account that created the trusted publishing policy

      - name: Publish to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The VS Code extension gets the same version. It is attached to the GitHub release,
      # and the extension job below publishes it from there.
      - name: Package the VS Code extension
        working-directory: vscode
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce@4 package --no-dependencies --out "../artifacts/sightline-$VERSION.vsix"

      # Last on purpose: the tag marks a version as released, so it is only set once the package is out.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.test.outputs.version }}" artifacts/*.nupkg artifacts/*.vsix
          --title "Sightline ${{ needs.test.outputs.version }}"
          --notes-file release-notes.md
          --target "$GITHUB_SHA"

  # Publishes the extension attached to the GitHub release. A separate job, so a marketplace that is
  # down never holds up the release, and it can run again on its own: "Re-run failed jobs", or
  # "Run workflow" with only the extension ticked.
  extension:
    needs: [test, publish]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || inputs.extension) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketplace.visualstudio.com/items?itemName=revington.sightline
    permissions:
      contents: read      # download the extension from the GitHub release
      id-token: write     # prove to the VS Code Marketplace which repository and environment is publishing (no stored token)

    steps:
      - name: Download the extension from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}   # empty when only the extension is published: the latest release
        run: gh release download ${VERSION:+"v$VERSION"} --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir artifacts

      # Trusted publishing (vsce 4 or later): the Marketplace checks this run against the policy of
      # publisher "revington" (repository, "release.yml", "production") and hands out a short-lived token.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath artifacts/*.vsix

      # Open VSX (for Cursor, VSCodium and other VS Code forks) needs a token. Secrets cannot appear
      # in "if:", so this step says whether it is set.
      - name: Is Open VSX set up
        id: ovsx
        env:
          SET: ${{ secrets.OVSX_PAT != '' }}
        run: echo "set=$SET" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        if: steps.ovsx.outputs.set == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1 publish --skip-duplicate --packagePath artifacts/*.vsix -p "$OVSX_PAT"
